name: Release gems

# Builds the source gem and one precompiled gem per Linux platform in Rakefile's
# CROSS_PLATFORMS. Installing a precompiled gem needs no Rust toolchain and
# takes seconds, rather than compiling 425 crates for several minutes.
#
# Runs on a version tag, and by hand to check the build without releasing.
# Publishing is left to the maintainer: download the gems artifact and
# `gem push` each file.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Source gem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - run: gem build ruby-c2pa.gemspec

      - uses: actions/upload-artifact@v4
        with:
          name: gem-ruby
          path: "*.gem"

  native:
    name: Native gem for ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - x86_64-linux
          - x86_64-linux-musl
          - aarch64-linux
          - aarch64-linux-musl
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      # rb-sys-dock bind-mounts these into its container, and docker refuses to
      # start when a bind source is missing, as it is on a fresh runner.
      - run: mkdir -p ~/.cargo/registry ~/.cargo/git

      - uses: oxidize-rb/actions/cross-gem@v1
        id: cross-gem
        with:
          platform: ${{ matrix.platform }}
          # Keep in step with required_ruby_version. rake-compiler narrows the
          # precompiled gem's own requirement to this range, so a Ruby outside
          # it falls back to the source gem instead of failing to load.
          ruby-versions: "3.1,3.2,3.3,3.4,4.0"

      - uses: actions/upload-artifact@v4
        with:
          name: gem-${{ matrix.platform }}
          path: ${{ steps.cross-gem.outputs.gem-path }}

  smoke:
    # A gem that builds can still fail to load: a missing per-version
    # directory, a binary linked against a library the target lacks, or the
    # loader picking the wrong path. Installing it on a runner with no Rust
    # and calling into c2pa-rs catches all three.
    name: Load on ${{ matrix.os }} with Ruby ${{ matrix.ruby }}
    needs: native
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: x86_64-linux, ruby: "3.3" }
          - { os: ubuntu-latest, platform: x86_64-linux, ruby: "3.4" }
          - { os: ubuntu-24.04-arm, platform: aarch64-linux, ruby: "3.3" }
    steps:
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - uses: actions/download-artifact@v4
        with:
          name: gem-${{ matrix.platform }}

      - name: Install the precompiled gem
        run: |
          gem install --local ./*.gem
          gem list ruby-c2pa

      - name: Call into c2pa-rs
        run: |
          ruby -e 'require "c2pa"; puts "c2pa-rs " + C2PA.sdk_version'
