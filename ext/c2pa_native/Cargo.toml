[package]
name = "c2pa_native"
version = "0.1.0"
edition = "2021"

[lib]
name = "c2pa_native"
crate-type = ["cdylib"]

[dependencies]
magnus = { version = "0.8", features = [] }
# Only for rb_thread_call_without_gvl, which magnus does not wrap. Kept at the
# range magnus itself depends on so Cargo resolves a single copy.
rb-sys = { version = "0.9.113", default-features = false }
c2pa = { version = "0.91.1", features = ["file_io", "pdf", "add_thumbnails"] }
serde_json = "1"
# Not used directly. c2pa-rs depends on zip with default features off, which
# leaves it able to read only stored entries, and real EPUB, Office and
# OpenDocument files deflate theirs. Cargo unifies features, so enabling
# deflate here gives it to c2pa-rs. flate2 is already in the tree.
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
